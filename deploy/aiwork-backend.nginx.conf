# /etc/nginx/conf.d/aiwork-backend.conf
#
# 部署前请把 server_name 改成你的公网域名 / IP
# 端口 80 监听, 反代 127.0.0.1:8001 给 FastAPI

server {
    listen 80;
    server_name 47.98.253.138;   # 公网 IP, 或改成域名

    # 日志
    access_log /var/log/nginx/aiwork-backend.access.log;
    error_log  /var/log/nginx/aiwork-backend.error.log;

    # 客户端 body 大小: 文档上传限制, 50MB 够用
    client_max_body_size 50M;

    # 静态前端(可选)  ----------------------------------------------------------
    # 假设前端 dist/ 部署在 /var/www/aitools/aiwork/
    # 如果你只跑后端, 删掉下面 location / 块即可
    # root /var/www/aitools/aiwork;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # 后端 API 反代  ----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;

        # SSE 流式输出必须关闭缓冲, 否则 /api/chat 一个 token 都推不出来
        proxy_buffering off;
        proxy_cache off;

        # WebSocket / 长连接 needed
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # 关闭 keepalive, 避免 upstream 阻塞

        # LLM 生成可能慢, 5 分钟不要掐
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE 额外优化: 不要 nginx 自动 gzip (会让浏览器看不到实时输出)
        gzip off;
    }

    # 健康检查直接命中, 不走 proxy  -------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        access_log off;
    }
}
